# Manual only. Answers one question: can a GitHub machine get HRSA's export the same way a
# person's browser does? It makes one attempt, prints the file's size and hash, and deletes the
# file. The raw export names people, so nothing from it is uploaded or kept.
name: pull-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
      - name: Install the locked dependencies and a browser
        run: |
          uv sync --locked --extra pull
          uv run playwright install --with-deps chromium
      - name: One attempt
        run: |
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          uv run opais pull --out "$out" --timeout 300
