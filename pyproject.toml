[project]
name = "clinx-radar"
version = "0.1.0"
description = "Keep dated snapshots of HRSA's 340B OPAIS daily export and report what changed between two dates."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Will Berchtold" }]
dependencies = []

[project.optional-dependencies]
pull = ["playwright==1.52.0"]

[project.scripts]
opais = "opais.cli:main"

[dependency-groups]
dev = ["mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.4"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opais"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "PL", "S", "ANN", "D"]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# The optional "pull" extra; checked only when it is installed.
module = ["playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
